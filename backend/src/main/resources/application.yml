spring:

  servlet:

    multipart:

      max-file-size: 100MB

      max-request-size: 100MB

torqueLive:

  fields:
    eml : Mail
    v: Version
    session: Session
    id: Id
    time: Device Time
    rpm: Engine RPM(rpm)
    speed: GPS Speed (Meters/second)
    coolant: Engine Coolant Temperature(°C)
    kff1005: Latitude
    kff1006: Longitude
    kff1001: Fuel
    kff1007: Throttle Position (%)

torque:

  fields:

    time: Device Time
    rpm: Engine RPM(rpm)
    speed: GPS Speed (Meters/second)
    coolant: Engine Coolant Temperature(°C)
    latitude: Latitude
    longitude: Longitude

  thresholds:

    Engine Coolant Temperature(°C):
      min: 70
      max: 100
      warningColor: yellow
      dangerColor: red

    Engine RPM(rpm):
      min: 0
      max: 8000
      warningColor: orange
      dangerColor: red

springdoc:
  swagger-ui:
    defaultModelsExpandDepth: -1

app:
  swagger:
    server-url: ""

management:
  endpoints:
    web:
      exposure:
        include: loggers
