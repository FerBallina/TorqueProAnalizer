torqueLive:
  fields:
    eml : Mail
    v: Version
    session: Session
    id: Id
    time: Device Time
    kff1005: Latitude
    kff1006: Longitude
    kff1001: Fuel
    kff1007: Throttle Position (%)

# esta lista son los valores fijos que no me deberian faltar para poder dibujar los dos graficos principales
torque:
  fields:
    time: Device Time
    rpm: Engine RPM(rpm)
    speed: GPS Speed (Meters/second)
    coolant: Engine Coolant Temperature(°C)
    latitude: Latitude
    longitude: Longitude

  thresholds:

    Engine Coolant Temperature(°C):
      min: 70
      max: 100
      warningColor: yellow
      dangerColor: red

    Engine RPM(rpm):
      min: 0
      max: 8000
      warningColor: orange
      dangerColor: red

#para no ver en swagger los schemas
springdoc:
  swagger-ui:
    defaultModelsExpandDepth: -1

app:
  swagger:
    server-url: ""

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://dpg-dbml67bm8hqs73apg9m0-a.oregon-postgres.render.com/torqueanalyzerdb
#    url: jdbc:postgresql://dpg-dbml67bm8hqs73apg9m0-a.oregon-postgres.rendero.com/torque
    username: ${DB_USER:db_user}
    password: ${DB_PASSWORD:db_pass}
    driver-class-name: org.postgresql.Driver
    #para que al arrancar spring si falla al intentar conectar con la DB
    #Spring siga cargando a la espera de que en algun momento se conecte
    hikari:
      initialization-fail-timeout: -1 
  security:
    user:
      name: ${ADMIN_USER:admin_user}
      password: ${ADMIN_PASS:admin_pass}
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none # Crea o actualiza la tabla automáticamente si no existe
    properties:
      hibernate:
        jdbc:
          batch_size: 5          # Agrupa los inserts de 50 en 50
        order_inserts: true       # Optimiza el ordenamiento para el batching

# Propiedad personalizada para manejar el tiempo del proceso asíncrono
telemetria:
  volcado-ms: 10000 # Tiempo en milisegundos (5 segundos). Podés cambiarlo a 10000 (10s), etc.

